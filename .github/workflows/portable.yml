name: Paquete portátil

# Genera LUDO-<versión>-portable.zip (aplicación compilada + servidor PowerShell, sin Node.js).
# - En cada push a main: queda como artefacto descargable en la pestaña Actions.
# - Al publicar una etiqueta v* (por ejemplo v2.4.1): se adjunta a una Release pública de GitHub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar versiones fijadas
        run: pnpm install --frozen-lockfile
      - name: Comprobar y generar el paquete
        run: pnpm test && pnpm portable
      - name: Guardar el paquete como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LUDO-portable
          path: release/*.zip
          retention-days: 90
      - name: Publicar en una Release (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Ludo ${GITHUB_REF_NAME}" \
            --notes "Versión portátil para Windows. Descomprime el zip y abre ABRIR_LUDO.cmd; no requiere instalar nada."
